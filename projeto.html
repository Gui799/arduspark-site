<!DOCTYPE html>
<HTml>
<head>
    <title>Projeto Gota</title>
     <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Ardu's Park - Projeto com Arduino e automoção. Conheça o Projeto Gota e nossa esquipe!">
    <link rel="icon" type="image/png" href="gotaicone.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        body{ 
            background-image: url("fundoprojetogota.png");
            background-size: cover;
            background-position: center; 
            background-repeat: no-repeat; 
            background-attachment: fixed}

        .container {
            background-color: antiquewhite;
            border: 4px solid rgb(48, 207, 0);
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            max-width: 800px;
            margin: 40px auto;
            text-align: center;}

        .containerdestaque {
            background-color: antiquewhite;
            padding: 20px;
            border-radius: 10px;
            border: 6px solid rgb(48, 207, 0);
            margin-top: 20px;
            max-width: 500px;
            margin: 40px auto;
            text-align: center;}

        .containerdestaque img {max-width: 100%; height: auto; border-radius: 8px;}

        .containermencao{
            background-color: rgb(42, 78, 31);
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #755439;
            margin-top: 20px;}

        .containerdetalhe {
            background-color: #fff;
            border: 2px dashed rgb(48, 207, 0);
            padding: 15px;
            margin-top: 5px;
            border-radius: 6px;
            text-align: center;
        }

        .ladoalado{
            display: flex;
            align-items: center;
            gap: 20px;
            margin-top: 20px;}

        h1 {color: rgb(0, 0, 0);
            text-align: center;
            font-family: 'Press Start 2P', cursive;
            font-weight: 700;
            font-size: 1.2rem;}
        h2 {color: rgb(0, 0, 0);
            text-align: center;
            font-family: 'Press Start 2P', cursive;
            font-size: 0.9rem;
            margin-top: 15px;}
        h3 {color: rgb(15, 110, 30);
            font-family: 'Poppins', sans-serif;
            font-size: 1.05rem;
            margin-top: 15px;
            margin-bottom: 5px;}

        p {color: #222;
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 16px;}

    </style>
</head>
<body>
    <div class="containerdestaque">
        <img src="gotaicone.png" alt="logo" class="containerdestaque img">
    </div>
</body>
</HTml>
